  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #8B96BA; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 6px;
  }
  .eyebrow svg { color: var(--accent-1); }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    text-align: center;
    font-size: 38px;
    margin: 0 0 20px 0;
    line-height: 1.05;
  }
  .ribbon {
    height: 3px; width: 100%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, var(--accent-1) 15%, var(--accent-2) 50%, var(--accent-1) 85%, transparent);
    margin-bottom: 24px;
  }
  label { font-size: 12px; color: #8B96BA; display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    background: var(--panel-color); border: 1px solid #2A3555; border-radius: 10px;
    color: #EAF0FB; padding: 13px 14px; font-size: 16px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent-1); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-gold {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); color: var(--bg-color); font-weight: 600; border-radius: 10px;
    padding: 13px 18px; font-size: 14px;
  }
  .btn-icon {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); color: var(--bg-color); border-radius: 10px; width: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel-color); border: 1px solid #2A3555; border-radius: 18px;
    padding: 20px; margin-top: 20px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .card-name { font-size: 12px; color: #8B96BA; }
  .card-progress { font-size: 14px; color: #C7D3EE; margin-top: 2px; }
  .redeemed { color: var(--accent-2); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .stamp {
    aspect-ratio: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #2A3555; font-size: 12px; color: #6f5f6c; font-weight: 500;
    transition: all 0.25s ease;
  }
  .stamp.filled {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-color: transparent; color: var(--bg-color);
    box-shadow: 0 0 0 4px rgba(79,134,247,0.15);
  }
  .note {
    background: var(--panel-color); border: 1px solid #2A3555; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; color: #C7D3EE; margin-top: 16px;
  }
  .invite {
    background: var(--panel-color); border: 1px solid #2A3555; border-radius: 14px;
    padding: 18px; margin-top: 16px; text-align: center;
  }
  .invite-title { font-size: 15px; font-weight: 600; color: #EAF0FB; margin-bottom: 6px; }
  .invite-desc { font-size: 13px; color: #8B96BA; line-height: 1.5; margin-bottom: 14px; }
  .invite-btn {
    display: block; width: 100%; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); color: var(--bg-color);
    font-weight: 600; border-radius: 10px; padding: 13px 18px; font-size: 14px; text-decoration: none;
    box-sizing: border-box;
  }
  .invite-buttons { display: flex; flex-direction: column; gap: 10px; }
  .invite-btn-outline {
    background: transparent; color: #EAF0FB; border: 1px solid #2A3555;
  }
  .link-btn {
    background: transparent; color: #8B96BA; font-size: 12px; padding: 10px;
    width: 100%; text-align: center; margin-top: 14px;
  }
  .footer { text-align: center; font-size: 10px; color: #6f5f6c; margin-top: 40px; }
  .credit { text-align: center; font-size: 11px; color: #6f5f6c; margin-top: 10px; }
  .credit a { color: #8B96BA; text-decoration: none; font-weight: 600; }
  .credit a:hover { color: var(--accent-2); }
  .loading { text-align: center; padding: 40px 0; color: #8B96BA; font-size: 13px; }
  .hidden { display: none; }
  .err { text-align: center; font-size: 13px; color: #e07a86; margin-top: 14px; }

  .demo { margin-top: 32px; text-align: center; }
  .demo-caption { font-size: 12px; color: #8B96BA; margin-bottom: 12px; letter-spacing: 0.02em; }
  .demo-card {
    background: var(--panel-color); border: 1px solid #2A3555; border-radius: 18px;
    padding: 20px; transition: box-shadow 0.4s ease;
  }
  .demo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .demo-stamp {
    aspect-ratio: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #2A3555; color: #6f5f6c;
  }
  .demo-stamp.filled {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-color: transparent; color: var(--bg-color);
    box-shadow: 0 0 0 4px rgba(79,134,247,0.15);
  }
  .demo-stamp.pop { animation: stampPop 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes stampPop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
  }
  .demo-card.complete { animation: cardBurst 0.9s ease; }
  @keyframes cardBurst {
    0% { box-shadow: 0 0 0 0 rgba(95,211,243,0.55); }
    70% { box-shadow: 0 0 0 18px rgba(95,211,243,0); }
    100% { box-shadow: 0 0 0 0 rgba(95,211,243,0); }
  }
  .demo-status {
    margin-top: 14px; font-size: 12px; color: #8B96BA; transition: color 0.3s ease;
  }
  .demo-status.complete { color: var(--accent-2); font-weight: 600; }

  .demo-gift {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.4s ease;
  }
  .demo-gift.show {
    max-height: 120px; opacity: 1; margin-top: 14px;
  }
  .demo-gift-icon {
    font-size: 40px; display: inline-block;
  }
  .demo-gift.show .demo-gift-icon { animation: giftPop 0.6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes giftPop {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }
  .demo-gift-text {
    font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px;
    color: var(--accent-2); margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-mask" role="img" aria-label="Bia Lash&amp;Hair">
      <div class="logo-layer logo-layer-main"></div>
      <div class="logo-layer logo-layer-accent"></div>
    </div>
    <div class="eyebrow">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.2L20 10l-6.4 1.8L12 18l-1.6-6.2L4 10l6.4-1.8L12 2z"/></svg>
      <span id="eyebrowText">Cartão Fidelidade</span>
    </div>
    <h1 id="businessName">Carregando…</h1>
    <div class="ribbon"></div>

    <div id="lookupForm">
      <label for="cpf" id="lookupLabelText">Digite seu CPF para ver seu cartão</label>
      <div class="row">
        <input id="cpf" placeholder="000.000.000-00" inputmode="numeric" />
        <button class="btn-icon" onclick="handleLookup()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <div id="result" class="hidden"></div>

    <div id="demoSection" class="demo">
      <div class="demo-caption">A cada atendimento, um selinho no seu cartão ✨</div>
      <div class="demo-card" id="demoCard">
        <div class="demo-grid" id="demoGrid"></div>
        <div class="demo-gift" id="demoGift">
          <div class="demo-gift-icon">🎁</div>
          <div class="demo-gift-text">Pode ser você!</div>
        </div>
        <div class="demo-status" id="demoStatus">Colecionando selinhos…</div>
      </div>
    </div>

    <div class="footer" id="footerText">Dados salvos no banco de dados do salão.</div>
    <div class="credit hidden" id="creditLine">Feito por <a id="creditLink" href="#" target="_blank" rel="noopener"></a></div>
  </div>

<script>
// Bloqueia o gesto de "puxar pra baixo" que recarrega a página no navegador do celular
let __touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  __touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  const touchY = e.touches[0].clientY;
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  if (scrollTop <= 0 && touchY > __touchStartY) {
    e.preventDefault();
  }
}, { passive: false });
</script>
<script>
// ── Conexão com o mesmo banco de dados (Supabase) do sistema do salão ──
const SUPABASE_URL = 'https://rliesnosftjhtrvfbhem.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaWVzbm9zZnRqaHRydmZiaGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzYxNDAsImV4cCI6MjA5NzIxMjE0MH0.jmaqLfm4wkamYIQaEIHTm1XFipftsPx1X0DotKbEYfk';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Todos os dados ficam na mesma tabela "donpita" (chave/valor), com o
// prefixo "loyalty_" para não se misturar com os dados do hotel.
async function dbGet(key) {
  const { data, error } = await supa.from('donpita').select('valor').eq('chave', key).maybeSingle();
  if (error) throw error;
  return data ? data.valor : null;
}
async function dbSet(key, val) {
  const { error } = await supa.from('donpita').upsert({ chave: key, valor: val }, { onConflict: 'chave' });
  if (error) throw error;
  return true;
}

let config = {
  businessName: "Bia Lash&Hair",
  stampsNeeded: 10,
  reward: "Um atendimento grátis",
  whatsapp: "",
  agendaLink: "",
  instagram: "",
  description: "A cada atendimento você ganha um selo no seu cartão. Ao completar todos os selos, você ganha a recompensa.",
  bgColor: "#0F1626",
  panelColor: "#1A2340",
  accent1: "#4F86F7",
  accent2: "#5FD3F3",
  logoColor: "#0a0a0a",
  texts: {
    eyebrowAdmin: "Painel do Salão",
    eyebrowClient: "Cartão Fidelidade",
    lookupLabelAdmin: "Digite o CPF do cliente",
    lookupLabelClient: "Digite seu CPF para ver seu cartão",
    newClientNote: "Cliente novo! Adicione um nome (opcional) e o primeiro selo.",
    inviteTitle: "Você ainda não tem cadastro 💫",
    inviteButton: "Gostaria de participar? Clique aqui e agende seu primeiro atendimento",
    inviteAgendaButton: "Agendar meu primeiro atendimento",
    inviteFallback: "Fale com a gente para agendar seu primeiro atendimento e começar a participar!",
    footerAdmin: "Dados conectados ao banco de dados do salão em tempo real.",
    footerClient: "Dados salvos no banco de dados do salão.",
  },
};

function formatCPF(v) { return (v || "").replace(/\D/g, ""); }
function formatDate(iso) {
  if (!iso) return "Nunca";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR");
}
function sparkleIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.2L20 10l-6.4 1.8L12 18l-1.6-6.2L4 10l6.4-1.8L12 2z"/></svg>`;
}
function formatDisplayCPF(cpf) {
  if (!cpf || cpf.length !== 11) return cpf;
  return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}

async function loadConfig() {
  try {
    const val = await dbGet("loyalty_config");
    if (val) {
      config = { ...config, ...val, texts: { ...config.texts, ...(val.texts || {}) } };
    }
  } catch (e) {
    console.error("Erro ao carregar configuração:", e);
  }
  document.getElementById("businessName").textContent = config.businessName;
  document.documentElement.style.setProperty("--bg-color", config.bgColor || "#0F1626");
  document.documentElement.style.setProperty("--panel-color", config.panelColor || "#1A2340");
  document.documentElement.style.setProperty("--accent-1", config.accent1 || "#4F86F7");
  document.documentElement.style.setProperty("--accent-2", config.accent2 || "#5FD3F3");
  document.documentElement.style.setProperty("--logo-color", config.logoColor || "#0a0a0a");
  document.getElementById("eyebrowText").textContent = config.texts.eyebrowClient;
  document.getElementById("lookupLabelText").textContent = config.texts.lookupLabelClient;
  document.getElementById("footerText").textContent = config.texts.footerClient;
  if (config.instagram) {
    const link = document.getElementById("creditLink");
    link.href = `https://instagram.com/${config.instagram}`;
    link.textContent = `@${config.instagram}`;
    document.getElementById("creditLine").classList.remove("hidden");
  }
  startDemoAnimation();
}

function startDemoAnimation() {
  const grid = document.getElementById("demoGrid");
  const status = document.getElementById("demoStatus");
  const card = document.getElementById("demoCard");
  const gift = document.getElementById("demoGift");
  const total = Math.max(3, Math.min(config.stampsNeeded || 10, 10));

  grid.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const el = document.createElement("div");
    el.className = "demo-stamp";
    el.textContent = i + 1;
    grid.appendChild(el);
  }
  const stamps = grid.querySelectorAll(".demo-stamp");

  let i = 0;
  function tick() {
    if (i < total) {
      const el = stamps[i];
      el.classList.add("filled", "pop");
      el.innerHTML = sparkleIcon();
      i++;
      setTimeout(tick, 550);
    } else {
      card.classList.add("complete");
      status.textContent = "🎉 Cartão completo!";
      status.classList.add("complete");
      gift.classList.add("show");
      setTimeout(() => {
        card.classList.remove("complete");
        status.classList.remove("complete");
        gift.classList.remove("show");
        status.textContent = "Colecionando selinhos…";
        stamps.forEach((el, idx) => {
          el.classList.remove("filled", "pop");
          el.textContent = idx + 1;
        });
        i = 0;
        setTimeout(tick, 900);
      }, 2200);
    }
  }
  setTimeout(tick, 700);
}

async function handleLookup() {
  const raw = document.getElementById("cpf").value;
  const cpf = formatCPF(raw);
  if (!cpf) return;

  document.getElementById("lookupForm").classList.add("hidden");
  document.getElementById("demoSection").classList.add("hidden");
  const result = document.getElementById("result");
  result.classList.remove("hidden");
  result.innerHTML = '<div class="loading">Carregando…</div>';

  let customer;
  try {
    const val = await dbGet(`loyalty_customer_${cpf}`);
    customer = val || { cpf, name: "", stamps: 0, redeemed: 0, isNew: true, lastStampDate: null };
  } catch (e) {
    result.innerHTML = `<div class="err">Não foi possível conectar ao banco de dados. Tente novamente.</div>
      <button class="link-btn" onclick="resetLookup()">Voltar</button>`;
    return;
  }

  renderCustomer(customer);
}

function renderCustomer(customer) {
  const result = document.getElementById("result");

  if (customer.isNew) {
    const waLink = config.whatsapp
      ? `https://wa.me/${config.whatsapp}?text=${encodeURIComponent("Olá! Vi o cartão fidelidade e gostaria de agendar meu primeiro atendimento para participar.")}`
      : null;
    const agendaLink = config.agendaLink || null;
    const hasLink = waLink || agendaLink;
    result.innerHTML = `
      <div class="invite">
        <div class="invite-title">${config.texts.inviteTitle}</div>
        <div class="invite-desc">
          ${config.description}<br/><br/>
          Ao completar ${config.stampsNeeded} selos você ganha: <strong>${config.reward}</strong>.
        </div>
        ${hasLink ? `<div class="invite-buttons">
          ${waLink ? `<a class="invite-btn" href="${waLink}" target="_blank" rel="noopener">${config.texts.inviteButton}</a>` : ""}
          ${agendaLink ? `<a class="invite-btn invite-btn-outline" href="${agendaLink}" target="_blank" rel="noopener">${config.texts.inviteAgendaButton}</a>` : ""}
        </div>` : `<div class="invite-desc" style="margin-bottom:0;">${config.texts.inviteFallback}</div>`}
      </div>
      <button class="link-btn" onclick="resetLookup()">Buscar outro CPF</button>
    `;
    return;
  }

  const stamps = customer.stamps || 0;
  const total = config.stampsNeeded;

  let stampsHtml = "";
  for (let i = 0; i < total; i++) {
    const filled = i < stamps;
    stampsHtml += `<div class="stamp ${filled ? "filled" : ""}">${filled ? sparkleIcon() : i + 1}</div>`;
  }

  result.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-name">${customer.name || formatDisplayCPF(customer.cpf)}</div>
          <div class="card-progress">${stamps} de ${total} selos</div>
        </div>
        ${(customer.redeemed || 0) > 0 ? `<div class="redeemed">🎁 ${customer.redeemed}x resgatado</div>` : ""}
      </div>
      <div class="grid">${stampsHtml}</div>
    </div>
    <button class="link-btn" onclick="resetLookup()">Buscar outro CPF</button>
  `;
}

function resetLookup() {
  document.getElementById("cpf").value = "";
  document.getElementById("result").classList.add("hidden");
  document.getElementById("result").innerHTML = "";
  document.getElementById("lookupForm").classList.remove("hidden");
  document.getElementById("demoSection").classList.remove("hidden");
}

function maskCPF(value) {
  const digits = value.replace(/\D/g, "").slice(0, 11);
  let out = digits;
  if (digits.length > 9) out = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
  else if (digits.length > 6) out = digits.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
  else if (digits.length > 3) out = digits.replace(/(\d{3})(\d{1,3})/, "$1.$2");
  return out;
}

const cpfInput = document.getElementById("cpf");
cpfInput.addEventListener("input", (e) => { e.target.value = maskCPF(e.target.value); });
cpfInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleLookup(); });

loadConfig();
</script>
