<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Cartão Fidelidade — Dono</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    touch-action: pan-y;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: #1F1720;
    color: #F3E9EC;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
    touch-action: pan-y;
  }
  input, button {
    touch-action: manipulation;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 32px 20px; }
  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #9C8797; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 6px;
  }
  .eyebrow svg { color: #C98A97; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    text-align: center;
    font-size: 38px;
    margin: 0 0 20px 0;
    line-height: 1.05;
  }
  .ribbon {
    height: 3px; width: 100%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, #C98A97 15%, #D9B382 50%, #C98A97 85%, transparent);
    margin-bottom: 20px;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 14px;
  }
  .toolbar button {
    background: transparent; color: #9C8797; font-size: 12px; display: flex; align-items: center; gap: 6px;
    font-family: inherit; cursor: pointer; border: 1px solid #423040; border-radius: 8px; padding: 7px 10px;
  }
  .toolbar button:hover { color: #C98A97; border-color: #C98A97; }
  .panel {
    background: #2A1F29; border: 1px solid #423040; border-radius: 14px;
    padding: 16px; margin-bottom: 20px;
  }
  .panel .field { margin-bottom: 12px; }
  label { font-size: 12px; color: #9C8797; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #1F1720; border: 1px solid #423040; border-radius: 10px;
    color: #F3E9EC; padding: 12px 14px; font-size: 16px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #C98A97; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-gold {
    width: 100%; background: linear-gradient(90deg, #C98A97, #D9B382); color: #1F1720; font-weight: 600; border-radius: 10px;
    padding: 13px 18px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-icon {
    background: linear-gradient(90deg, #C98A97, #D9B382); color: #1F1720; border-radius: 10px; width: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #2A1F29; border: 1px solid #423040; border-radius: 18px;
    padding: 20px; margin-top: 20px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .card-name { font-size: 12px; color: #9C8797; }
  .card-progress { font-size: 14px; color: #E4D6DA; margin-top: 2px; }
  .redeemed { color: #D9B382; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .stamp {
    aspect-ratio: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #423040; font-size: 12px; color: #6f5f6c; font-weight: 500;
    transition: all 0.25s ease;
  }
  .stamp.filled {
    background: linear-gradient(135deg, #C98A97, #D9B382); border-color: transparent; color: #1F1720;
    box-shadow: 0 0 0 4px rgba(201,138,151,0.15);
  }
  .last-stamp { font-size: 12px; color: #9C8797; margin-top: 10px; }
  .note {
    background: #2A1F29; border: 1px solid #423040; border-radius: 10px;
    padding: 12px 14px; font-size: 13px; color: #E4D6DA; margin-top: 16px;
  }
  .msg { text-align: center; font-size: 13px; color: #D9B382; margin-top: 14px; }
  .link-btn {
    background: transparent; color: #9C8797; font-size: 12px; padding: 10px;
    width: 100%; text-align: center; margin-top: 14px;
  }
  .footer { text-align: center; font-size: 10px; color: #6f5f6c; margin-top: 40px; }
  .loading { text-align: center; padding: 40px 0; color: #9C8797; font-size: 13px; }
  .hidden { display: none; }
  .stack > * + * { margin-top: 14px; }

  .client-list { list-style: none; margin: 0; padding: 0; }
  .client-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #423040; gap: 10px;
    cursor: pointer; border-radius: 8px; transition: background 0.15s ease;
  }
  .client-item:last-child { border-bottom: none; }
  .client-item:hover, .client-item:active { background: rgba(201,138,151,0.08); }
  .stamp-actions { display: flex; gap: 8px; }
  .stamp-actions .btn-gold { flex: 1; margin: 0; }
  .btn-remove {
    flex: 1; background: transparent; color: #E4D6DA; font-weight: 600; border-radius: 10px;
    padding: 13px 18px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid #423040;
  }
  .btn-remove:disabled { opacity: 0.4; cursor: not-allowed; }
  .edit-toggle {
    background: transparent; border: 1px solid #423040; color: #9C8797; border-radius: 8px;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .edit-toggle:hover { color: #C98A97; border-color: #C98A97; }
  .edit-form { background: #2A1F29; border: 1px solid #423040; border-radius: 14px; padding: 16px; }
  .edit-form .field:last-of-type { margin-bottom: 0; }
  .edit-form .stamp-actions { margin-top: 14px; }
  .client-info { min-width: 0; }
  .client-name { font-size: 14px; font-weight: 600; color: #F3E9EC; }
  .client-cpf { font-size: 11px; color: #9C8797; margin-top: 1px; }
  .client-meta { text-align: right; flex-shrink: 0; }
  .client-last { font-size: 12px; color: #E4D6DA; }
  .client-stamps { font-size: 11px; color: #D9B382; margin-top: 2px; }
  .search-input { margin-bottom: 14px; }
  .empty-state { text-align: center; padding: 24px 0; color: #9C8797; font-size: 13px; }
  .err { text-align: center; font-size: 13px; color: #e07a86; margin-top: 14px; }
  .rank-badge {
    width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #C98A97, #D9B382); color: #1F1720;
    font-size: 12px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="wrap">

      <button onclick="toggleTextos()">

<script>
// ── Conexão com o mesmo banco de dados (Supabase) do sistema do salão ──
const SUPABASE_URL = 'https://rliesnosftjhtrvfbhem.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaWVzbm9zZnRqaHRydmZiaGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzYxNDAsImV4cCI6MjA5NzIxMjE0MH0.jmaqLfm4wkamYIQaEIHTm1XFipftsPx1X0DotKbEYfk';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Todos os dados ficam na mesma tabela "donpita" (chave/valor), com o
// prefixo "loyalty_" para não se misturar com os dados do hotel.
async function dbGet(key) {
  const { data, error } = await supa.from('donpita').select('valor').eq('chave', key).maybeSingle();
  if (error) throw error;
  return data ? data.valor : null;
}
async function dbSet(key, val) {
  const { error } = await supa.from('donpita').upsert({ chave: key, valor: val }, { onConflict: 'chave' });
  if (error) throw error;
  return true;
}
async function dbListPrefix(prefix) {
  const { data, error } = await supa.from('donpita').select('chave, valor').like('chave', `${prefix}%`);
  if (error) throw error;
  return data || [];
}

let config = {
  businessName: "Salão de Beleza",
  stampsNeeded: 10,
  reward: "Um atendimento grátis",
  whatsapp: "",
  description: "A cada atendimento você ganha um selo no seu cartão. Ao completar todos os selos, você ganha a recompensa.",
  texts: {
    eyebrowAdmin: "Painel do Salão",
    eyebrowClient: "Cartão Fidelidade",
    lookupLabelAdmin: "Digite o CPF do cliente",
    lookupLabelClient: "Digite seu CPF para ver seu cartão",
    newClientNote: "Cliente novo! Adicione um nome (opcional) e o primeiro selo.",
    inviteTitle: "Você ainda não tem cadastro 💫",
    inviteButton: "Gostaria de participar? Clique aqui e agende seu primeiro atendimento",
    inviteFallback: "Fale com a gente para agendar seu primeiro atendimento e começar a participar!",
    footerAdmin: "Dados conectados ao banco de dados do salão em tempo real.",
    footerClient: "Dados salvos no banco de dados do salão.",
  },
};
let currentCustomer = null;
let clientsCache = null;
let cameFromList = false;
let editingCustomer = false;

function formatCPF(v) { return (v || "").replace(/\D/g, ""); }
function formatDisplayCPF(cpf) {
  if (!cpf || cpf.length !== 11) return cpf;
  return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
}
function formatDate(iso) {
  if (!iso) return "Nunca";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR");
}
function sparkleIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.2L20 10l-6.4 1.8L12 18l-1.6-6.2L4 10l6.4-1.8L12 2z"/></svg>`;
}

async function loadConfig() {
  try {
    const val = await dbGet("loyalty_config");
    if (val) {
      config = { ...config, ...val, texts: { ...config.texts, ...(val.texts || {}) } };
    }
  } catch (e) {
    console.error("Erro ao carregar configuração:", e);
  }
  document.getElementById("businessName").textContent = config.businessName;
  document.getElementById("cfgName").value = config.businessName;
  document.getElementById("cfgStamps").value = config.stampsNeeded;
  document.getElementById("cfgReward").value = config.reward;
  document.getElementById("cfgWhatsapp").value = config.whatsapp || "";
  document.getElementById("cfgDesc").value = config.description || "";

  document.getElementById("eyebrowAdminText").textContent = config.texts.eyebrowAdmin;
  document.getElementById("lookupLabelText").textContent = config.texts.lookupLabelAdmin;
  document.getElementById("footerText").textContent = config.texts.footerAdmin;

  document.getElementById("txtEyebrowAdmin").value = config.texts.eyebrowAdmin;
  document.getElementById("txtEyebrowClient").value = config.texts.eyebrowClient;
  document.getElementById("txtLookupAdmin").value = config.texts.lookupLabelAdmin;
  document.getElementById("txtLookupClient").value = config.texts.lookupLabelClient;
  document.getElementById("txtNewClientNote").value = config.texts.newClientNote;
  document.getElementById("txtInviteTitle").value = config.texts.inviteTitle;
  document.getElementById("txtInviteButton").value = config.texts.inviteButton;
  document.getElementById("txtInviteFallback").value = config.texts.inviteFallback;
  document.getElementById("txtFooterAdmin").value = config.texts.footerAdmin;
  document.getElementById("txtFooterClient").value = config.texts.footerClient;
}

function closeAllPanels() {
  document.getElementById("settingsPanel").classList.add("hidden");
  document.getElementById("cadastroPanel").classList.add("hidden");
  document.getElementById("clientesPanel").classList.add("hidden");
  document.getElementById("rankingPanel").classList.add("hidden");
  document.getElementById("textosPanel").classList.add("hidden");
}

function toggleSettings() {
  const el = document.getElementById("settingsPanel");
  const willShow = el.classList.contains("hidden");
  closeAllPanels();
  if (willShow) el.classList.remove("hidden");
}

function toggleTextos() {
  const el = document.getElementById("textosPanel");
  const willShow = el.classList.contains("hidden");
  closeAllPanels();
  if (willShow) el.classList.remove("hidden");
}

function toggleCadastro() {
  const el = document.getElementById("cadastroPanel");
  const willShow = el.classList.contains("hidden");
  closeAllPanels();
  if (willShow) el.classList.remove("hidden");
}

function toggleClientes() {
  const el = document.getElementById("clientesPanel");
  const willShow = el.classList.contains("hidden");
  closeAllPanels();
  if (willShow) {
    el.classList.remove("hidden");
    loadClientList();
  }
}

function toggleRanking() {
  const el = document.getElementById("rankingPanel");
  const willShow = el.classList.contains("hidden");
  closeAllPanels();
  if (willShow) {
    el.classList.remove("hidden");
    loadRanking();
  }
}

async function loadClientList() {
  document.getElementById("clientListWrap").innerHTML = '<div class="loading">Carregando clientes…</div>';
  try {
    const rows = await dbListPrefix("loyalty_customer_");
    clientsCache = rows.map((r) => r.valor).filter(Boolean);
    clientsCache.sort((a, b) => {
      const da = a.lastStampDate ? new Date(a.lastStampDate).getTime() : -1;
      const db = b.lastStampDate ? new Date(b.lastStampDate).getTime() : -1;
      return db - da;
    });
  } catch (e) {
    document.getElementById("clientListWrap").innerHTML = `<div class="err">Não foi possível carregar os clientes. Verifique a conexão.</div>`;
    clientsCache = null;
    return;
  }
  renderClientList();
}

function renderClientList() {
  const wrap = document.getElementById("clientListWrap");
  if (!clientsCache) return;
  const query = (document.getElementById("clientSearch").value || "").toLowerCase().trim();
  const filtered = clientsCache.filter((c) => {
    if (!query) return true;
    const digits = query.replace(/\D/g, "");
    const matchName = (c.name || "").toLowerCase().includes(query);
    const matchCpf = digits && (c.cpf || "").includes(digits);
    const matchPhone = digits && (c.phone || "").replace(/\D/g, "").includes(digits);
    return matchName || matchCpf || matchPhone;
  });

  if (filtered.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Nenhum cliente cadastrado ainda.</div>`;
    return;
  }

  wrap.innerHTML = `<ul class="client-list">${filtered
    .map(
      (c) => `
    <li class="client-item" onclick="abrirCliente('${c.cpf}')">
      <div class="client-info">
        <div class="client-name">${c.name || "Sem nome"}</div>
        <div class="client-cpf">${formatDisplayCPF(c.cpf)}</div>
      </div>
      <div class="client-meta">
        <div class="client-last">${formatDate(c.lastStampDate)}</div>
        <div class="client-stamps">${c.stamps || 0}/${config.stampsNeeded} selos</div>
      </div>
    </li>`
    )
    .join("")}</ul>`;
}

async function loadRanking() {
  const wrap = document.getElementById("rankingWrap");
  wrap.innerHTML = '<div class="loading">Carregando ranking…</div>';
  let rows;
  try {
    rows = await dbListPrefix("loyalty_customer_");
  } catch (e) {
    wrap.innerHTML = `<div class="err">Não foi possível carregar o ranking. Verifique a conexão.</div>`;
    return;
  }
  clientsCache = rows.map((r) => r.valor).filter(Boolean);
  renderRanking();
}

function renderRanking() {
  const wrap = document.getElementById("rankingWrap");
  if (!clientsCache) return;
  const query = (document.getElementById("rankingSearch").value || "").toLowerCase().trim();
  const digits = query.replace(/\D/g, "");
  const filtered = clientsCache.filter((c) => {
    if (!query) return true;
    const matchName = (c.name || "").toLowerCase().includes(query);
    const matchCpf = digits && (c.cpf || "").includes(digits);
    const matchPhone = digits && (c.phone || "").replace(/\D/g, "").includes(digits);
    return matchName || matchCpf || matchPhone;
  });
  const sorted = [...filtered].sort((a, b) => (b.stamps || 0) - (a.stamps || 0));

  if (sorted.length === 0) {
    wrap.innerHTML = `<div class="empty-state">Nenhum cliente encontrado.</div>`;
    return;
  }

  wrap.innerHTML = `<ul class="client-list">${sorted
    .map(
      (c, i) => `
    <li class="client-item" onclick="abrirCliente('${c.cpf}')">
      <div class="client-info" style="display:flex; align-items:center; gap:10px;">
        <div class="rank-badge">${i + 1}º</div>
        <div>
          <div class="client-name">${c.name || formatDisplayCPF(c.cpf)}</div>
          <div class="client-cpf">${formatDisplayCPF(c.cpf)}</div>
        </div>
      </div>
      <div class="client-meta">
        <div class="client-stamps" style="font-size:14px; font-weight:600;">${c.stamps || 0}/${config.stampsNeeded} selos</div>
        ${(c.redeemed || 0) > 0 ? `<div class="client-last">🎁 ${c.redeemed}x resgatado</div>` : ""}
      </div>
    </li>`
    )
    .join("")}</ul>`;
}

async function saveTextos() {
  config.texts = {
    eyebrowAdmin: document.getElementById("txtEyebrowAdmin").value.trim() || "Painel do Salão",
    eyebrowClient: document.getElementById("txtEyebrowClient").value.trim() || "Cartão Fidelidade",
    lookupLabelAdmin: document.getElementById("txtLookupAdmin").value.trim() || "Digite o CPF do cliente",
    lookupLabelClient: document.getElementById("txtLookupClient").value.trim() || "Digite seu CPF para ver seu cartão",
    newClientNote: document.getElementById("txtNewClientNote").value.trim() || "Cliente novo! Adicione um nome (opcional) e o primeiro selo.",
    inviteTitle: document.getElementById("txtInviteTitle").value.trim() || "Você ainda não tem cadastro 💫",
    inviteButton: document.getElementById("txtInviteButton").value.trim() || "Gostaria de participar? Clique aqui e agende seu primeiro atendimento",
    inviteFallback: document.getElementById("txtInviteFallback").value.trim() || "Fale com a gente para agendar seu primeiro atendimento e começar a participar!",
    footerAdmin: document.getElementById("txtFooterAdmin").value.trim() || "Dados conectados ao banco de dados do salão em tempo real.",
    footerClient: document.getElementById("txtFooterClient").value.trim() || "Dados salvos no banco de dados do salão.",
  };

  const msgEl = document.getElementById("textosMsg");
  msgEl.classList.remove("hidden");
  try {
    await dbSet("loyalty_config", config);
  } catch (e) {
    msgEl.textContent = `Não foi possível salvar os textos (${e.message || e}). Tente novamente.`;
    msgEl.style.color = "#e07a86";
    return;
  }

  document.getElementById("eyebrowAdminText").textContent = config.texts.eyebrowAdmin;
  document.getElementById("lookupLabelText").textContent = config.texts.lookupLabelAdmin;
  document.getElementById("footerText").textContent = config.texts.footerAdmin;

  msgEl.textContent = "Textos salvos com sucesso!";
  msgEl.style.color = "#D9B382";
}

// Abre o cartão de um cliente já cadastrado a partir da lista,
// puxando os selinhos dele e permitindo adicionar/remover.
async function abrirCliente(cpf) {
  closeAllPanels();
  document.getElementById("lookupForm").classList.add("hidden");
  const result = document.getElementById("result");
  result.classList.remove("hidden");
  result.innerHTML = '<div class="loading">Carregando…</div>';

  let customer = clientsCache ? clientsCache.find((c) => c.cpf === cpf) : null;
  try {
    const fresh = await dbGet(`loyalty_customer_${cpf}`);
    if (fresh) customer = fresh;
  } catch (e) {
    // se falhar, segue com o que já temos em cache (se houver)
  }

  if (!customer) {
    result.innerHTML = `<div class="err">Cliente não encontrado.</div>
      <button class="link-btn" onclick="resetLookup()">Voltar</button>`;
    return;
  }

  currentCustomer = customer;
  cameFromList = true;
  editingCustomer = false;
  renderCustomer();
}

async function saveSettings() {
  config = {
    ...config,
    businessName: document.getElementById("cfgName").value.trim() || "Salão de Beleza",
    stampsNeeded: Number(document.getElementById("cfgStamps").value) || 10,
    reward: document.getElementById("cfgReward").value.trim() || "Um atendimento grátis",
    whatsapp: document.getElementById("cfgWhatsapp").value.replace(/\D/g, ""),
    description: document.getElementById("cfgDesc").value.trim() || "A cada atendimento você ganha um selo no seu cartão. Ao completar todos os selos, você ganha a recompensa.",
  };
  try {
    await dbSet("loyalty_config", config);
  } catch (e) {
    alert("Não foi possível salvar. Verifique a conexão e tente novamente.");
    return;
  }
  document.getElementById("businessName").textContent = config.businessName;
  closeAllPanels();
}

async function cadastrarCliente() {
  const cpf = formatCPF(document.getElementById("regCpf").value);
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const msgEl = document.getElementById("cadastroMsg");
  msgEl.classList.remove("hidden");

  if (cpf.length !== 11) {
    msgEl.textContent = "Digite um CPF válido (11 números).";
    msgEl.style.color = "#e07a86";
    return;
  }
  if (!name) {
    msgEl.textContent = "Digite o nome do cliente.";
    msgEl.style.color = "#e07a86";
    return;
  }

  let existing;
  try {
    existing = await dbGet(`loyalty_customer_${cpf}`);
  } catch (e) {
    msgEl.textContent = `Não foi possível verificar o CPF (${e.message || e}). Tente novamente.`;
    msgEl.style.color = "#e07a86";
    return;
  }

  if (existing) {
    msgEl.textContent = "Esse CPF já está cadastrado.";
    msgEl.style.color = "#e07a86";
    return;
  }

  const newCustomer = {
    cpf, name, phone,
    stamps: 0, redeemed: 0, isNew: false,
    registeredDate: new Date().toISOString(),
    lastStampDate: null,
  };

  try {
    await dbSet(`loyalty_customer_${cpf}`, newCustomer);
  } catch (e) {
    msgEl.textContent = `Não foi possível cadastrar (${e.message || e}). Tente novamente.`;
    msgEl.style.color = "#e07a86";
    return;
  }

  msgEl.textContent = `Cliente ${name} cadastrado com sucesso!`;
  msgEl.style.color = "#D9B382";
  document.getElementById("regCpf").value = "";
  document.getElementById("regName").value = "";
  document.getElementById("regPhone").value = "";
  clientsCache = null;
}

async function handleLookup() {
  const raw = document.getElementById("cpf").value;
  const cpf = formatCPF(raw);
  if (!cpf) return;

  cameFromList = false;
  editingCustomer = false;
  document.getElementById("lookupForm").classList.add("hidden");
  const result = document.getElementById("result");
  result.classList.remove("hidden");
  result.innerHTML = '<div class="loading">Carregando…</div>';

  let customer;
  try {
    const val = await dbGet(`loyalty_customer_${cpf}`);
    customer = val || { cpf, name: "", stamps: 0, redeemed: 0, isNew: true, lastStampDate: null };
  } catch (e) {
    result.innerHTML = `<div class="err">Não foi possível conectar ao banco de dados. Tente novamente.</div>
      <button class="link-btn" onclick="resetLookup()">Voltar</button>`;
    return;
  }
  currentCustomer = customer;
  renderCustomer();
}

function renderCustomer(msg) {
  const result = document.getElementById("result");
  const customer = currentCustomer;
  const stamps = customer.stamps || 0;
  const total = config.stampsNeeded;

  let stampsHtml = "";
  for (let i = 0; i < total; i++) {
    const filled = i < stamps;
    stampsHtml += `<div class="stamp ${filled ? "filled" : ""}">${filled ? sparkleIcon() : i + 1}</div>`;
  }

  const editBtn = !customer.isNew
    ? `<button class="edit-toggle" onclick="toggleEditCustomer()" title="Editar dados">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>`
    : "";

  const editForm = editingCustomer
    ? `<div class="edit-form">
        <div class="field">
          <label for="editName">Nome completo</label>
          <input id="editName" value="${(customer.name || "").replace(/"/g, "&quot;")}" placeholder="Nome do cliente" />
        </div>
        <div class="field">
          <label for="editPhone">Telefone</label>
          <input id="editPhone" value="${(customer.phone || "").replace(/"/g, "&quot;")}" placeholder="(11) 99999-9999" />
        </div>
        <div class="stamp-actions">
          <button class="btn-remove" onclick="toggleEditCustomer()">Cancelar</button>
          <button class="btn-gold" onclick="salvarEdicaoCliente()">Salvar dados</button>
        </div>
      </div>`
    : "";

  result.innerHTML = `
    <div class="stack">
      ${customer.isNew ? `<div class="note">${config.texts.newClientNote}</div>` : ""}
      ${customer.isNew ? `<input id="customerName" placeholder="Nome do cliente (opcional)" />` : ""}
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-name">${customer.name || formatDisplayCPF(customer.cpf)}</div>
            <div class="card-progress">${stamps} de ${total} selos</div>
          </div>
          <div style="display:flex; align-items:flex-start; gap:8px;">
            ${(customer.redeemed || 0) > 0 ? `<div class="redeemed">🎁 ${customer.redeemed}x resgatado</div>` : ""}
            ${editBtn}
          </div>
        </div>
        <div class="grid">${stampsHtml}</div>
        ${!customer.isNew ? `<div class="last-stamp">Último selinho: ${formatDate(customer.lastStampDate)}</div>` : ""}
      </div>
      ${editForm}
      ${!editingCustomer ? `
      <div class="stamp-actions">
        <button class="btn-remove" onclick="removeStamp()" ${stamps <= 0 ? "disabled" : ""}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Remover selo
        </button>
        <button class="btn-gold" onclick="addStamp()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Adicionar selo
        </button>
      </div>` : ""}
      ${msg ? `<div class="msg">${msg}</div>` : ""}
      <button class="link-btn" onclick="resetLookup()">${cameFromList ? "Voltar para a lista" : "Buscar outro CPF"}</button>
    </div>
  `;
}

async function addStamp() {
  if (!currentCustomer) return;
  const nameInput = document.getElementById("customerName");
  if (nameInput && nameInput.value.trim() && !currentCustomer.name) {
    currentCustomer.name = nameInput.value.trim();
  }
  currentCustomer.isNew = false;
  currentCustomer.stamps = (currentCustomer.stamps || 0) + 1;
  currentCustomer.lastStampDate = new Date().toISOString();

  let msg;
  if (currentCustomer.stamps >= config.stampsNeeded) {
    currentCustomer.stamps = 0;
    currentCustomer.redeemed = (currentCustomer.redeemed || 0) + 1;
    msg = `🎉 Cartão completo! Cliente ganhou: ${config.reward}`;
  } else {
    msg = `Selo adicionado (${currentCustomer.stamps}/${config.stampsNeeded})`;
  }

  try {
    await dbSet(`loyalty_customer_${currentCustomer.cpf}`, currentCustomer);
  } catch (e) {
    alert(`Não foi possível salvar o selo (${e.message || e}). Tente novamente.`);
    return;
  }

  clientsCache = null;
  renderCustomer(msg);
}

function toggleEditCustomer() {
  editingCustomer = !editingCustomer;
  renderCustomer();
}

async function salvarEdicaoCliente() {
  if (!currentCustomer) return;
  const name = document.getElementById("editName").value.trim();
  const phone = document.getElementById("editPhone").value.trim();

  const updated = { ...currentCustomer, name, phone };

  try {
    await dbSet(`loyalty_customer_${currentCustomer.cpf}`, updated);
  } catch (e) {
    alert(`Não foi possível salvar as alterações (${e.message || e}). Tente novamente.`);
    return;
  }

  currentCustomer = updated;
  editingCustomer = false;
  clientsCache = null;
  renderCustomer("Dados atualizados com sucesso!");
}

async function removeStamp() {
  if (!currentCustomer) return;
  if ((currentCustomer.stamps || 0) <= 0) return;

  currentCustomer.stamps = currentCustomer.stamps - 1;

  try {
    await dbSet(`loyalty_customer_${currentCustomer.cpf}`, currentCustomer);
  } catch (e) {
    alert(`Não foi possível remover o selo (${e.message || e}). Tente novamente.`);
    currentCustomer.stamps = currentCustomer.stamps + 1;
    return;
  }

  clientsCache = null;
  renderCustomer(`Selo removido (${currentCustomer.stamps}/${config.stampsNeeded})`);
}

function resetLookup() {
  currentCustomer = null;
  editingCustomer = false;
  document.getElementById("cpf").value = "";
  document.getElementById("result").classList.add("hidden");
  document.getElementById("result").innerHTML = "";
  if (cameFromList) {
    cameFromList = false;
    document.getElementById("clientesPanel").classList.remove("hidden");
    loadClientList();
  } else {
    document.getElementById("lookupForm").classList.remove("hidden");
  }
}

function maskCPF(value) {
  const digits = value.replace(/\D/g, "").slice(0, 11);
  let out = digits;
  if (digits.length > 9) out = digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
  else if (digits.length > 6) out = digits.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
  else if (digits.length > 3) out = digits.replace(/(\d{3})(\d{1,3})/, "$1.$2");
  return out;
}

const cpfInput = document.getElementById("cpf");
cpfInput.addEventListener("input", (e) => { e.target.value = maskCPF(e.target.value); });
cpfInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleLookup(); });

const regCpfInput = document.getElementById("regCpf");
regCpfInput.addEventListener("input", (e) => { e.target.value = maskCPF(e.target.value); });

loadConfig();
</script>
